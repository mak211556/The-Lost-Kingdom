<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Lost Kingdom</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;
background:#111;

}


canvas{

display:block;

}

</style>

</head>


<body>


<canvas id="game"></canvas>


<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);





const keys={};


document.addEventListener("keydown",e=>{

keys[e.key]=true;

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});






const player={

x:300,
y:400,

velocityY:0,

speed:5,

gravity:.8,

jump:-15,

width:60,
height:100,

ground:false,

direction:1,

running:false,

animation:0

};





const camera={

x:0

};






const world={

ground:650

};








function update(){



player.running=false;



if(keys["d"]||keys["ArrowRight"]){

player.x+=player.speed;

player.direction=1;

player.running=true;

}



if(keys["a"]||keys["ArrowLeft"]){

player.x-=player.speed;

player.direction=-1;

player.running=true;

}





if(
(keys[" "]||keys["w"]||keys["ArrowUp"])
&&player.ground
){

player.velocityY=player.jump;

player.ground=false;

}





player.velocityY+=player.gravity;

player.y+=player.velocityY;






if(player.y+player.height>=world.ground){

player.y=world.ground-player.height;

player.velocityY=0;

player.ground=true;

}




player.animation+=0.15;



camera.x=player.x-canvas.width/3;



if(camera.x<0){

camera.x=0;

}



}









function drawCharacter(){



let x=player.x-camera.x;
let y=player.y;



let bob=
player.running ?
Math.sin(player.animation)*3 :
Math.sin(player.animation*.5)*2;




ctx.save();


ctx.translate(
x+30,
y+bob
);



if(player.direction===-1){

ctx.scale(-1,1);

}





// legs


let legMove=
player.running ?
Math.sin(player.animation)*12:
0;



ctx.strokeStyle="#2b2118";

ctx.lineWidth=10;

ctx.lineCap="round";



// back leg

ctx.beginPath();

ctx.moveTo(-10,65);

ctx.lineTo(
-15,
95+legMove
);

ctx.stroke();


// front leg

ctx.beginPath();

ctx.moveTo(10,65);

ctx.lineTo(
15,
95-legMove
);

ctx.stroke();





// boots


ctx.fillStyle="#151515";


ctx.beginPath();

ctx.roundRect(
-25,
88+legMove,
22,
12,
6
);

ctx.fill();



ctx.beginPath();

ctx.roundRect(
5,
88-legMove,
22,
12,
6
);

ctx.fill();






// body / tunic


ctx.fillStyle="#8b7d6b";


ctx.beginPath();


ctx.roundRect(
-25,
0,
50,
70,
15
);


ctx.fill();






// shoulder armour


ctx.fillStyle="#d4af37";


ctx.beginPath();

ctx.arc(
-25,
15,
10,
0,
Math.PI*2
);

ctx.fill();



ctx.beginPath();

ctx.arc(
25,
15,
10,
0,
Math.PI*2
);

ctx.fill();






// arms


let armMove=
player.running ?
Math.sin(player.animation)*15:
0;


ctx.strokeStyle="#c69c6d";

ctx.lineWidth=8;



ctx.beginPath();

ctx.moveTo(-25,25);

ctx.lineTo(
-40,
45+armMove
);

ctx.stroke();



ctx.beginPath();

ctx.moveTo(25,25);

ctx.lineTo(
40,
45-armMove
);

ctx.stroke();






// neck


ctx.fillStyle="#c69c6d";

ctx.fillRect(
-8,
-10,
16,
15
);







// head


ctx.fillStyle="#c69c6d";


ctx.beginPath();

ctx.arc(
0,
-30,
22,
0,
Math.PI*2
);

ctx.fill();







// hair


ctx.fillStyle="#171717";


ctx.beginPath();

ctx.arc(
0,
-38,
22,
Math.PI,
Math.PI*2
);

ctx.fill();





ctx.restore();


}









function drawWorld(){



ctx.fillStyle="#1a1a1a";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);




// floor


ctx.fillStyle="#6e6254";


ctx.fillRect(
-camera.x,
world.ground,
3000,
200
);




// distant ruins


ctx.fillStyle="rgba(255,255,255,.08)";


for(let i=0;i<10;i++){


ctx.fillRect(

i*300-camera.x*.3,
400,
120,
250

);


}



}








function loop(){


update();


drawWorld();


drawCharacter();


requestAnimationFrame(loop);


}



loop();



</script>


</body>

</html>
