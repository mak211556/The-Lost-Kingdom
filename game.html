<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Lost Kingdom</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#111;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);



const keys = {};

document.addEventListener("keydown",(e)=>{

keys[e.key] = true;

});

document.addEventListener("keyup",(e)=>{

keys[e.key] = false;

});



const player = {

x:150,
y:300,

width:42,
height:70,

speed:6,

velocityY:0,

gravity:0.8,

jumpPower:-16,

grounded:false,

direction:1

};



const platforms = [

{
x:0,
y:650,
width:3000,
height:150
},

{
x:500,
y:520,
width:250,
height:25
},

{
x:900,
y:420,
width:250,
height:25
},

{
x:1350,
y:320,
width:250,
height:25
}

];



let cameraX = 0;



function update(){


if(keys["a"] || keys["ArrowLeft"]){

player.x -= player.speed;
player.direction = -1;

}


if(keys["d"] || keys["ArrowRight"]){

player.x += player.speed;
player.direction = 1;

}



if(

(keys["w"] || keys["ArrowUp"] || keys[" "])

&& player.grounded

){

player.velocityY = player.jumpPower;
player.grounded = false;

}



player.velocityY += player.gravity;

player.y += player.velocityY;



player.grounded = false;



for(const platform of platforms){

if(

player.x + player.width > platform.x &&
player.x < platform.x + platform.width &&
player.y + player.height > platform.y &&
player.y + player.height < platform.y + platform.height + 20 &&
player.velocityY >= 0

){

player.y = platform.y - player.height;

player.velocityY = 0;

player.grounded = true;

}

}



cameraX = player.x - canvas.width / 3;

if(cameraX < 0){

cameraX = 0;

}

}



function drawSky(){


const sky = ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

sky.addColorStop(0,"#1a1a1a");
sky.addColorStop(1,"#353535");

ctx.fillStyle = sky;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



ctx.beginPath();

ctx.arc(
canvas.width - 200,
120,
60,
0,
Math.PI*2
);

ctx.fillStyle = "#d4af37";

ctx.fill();

}



function drawPlatforms(){


ctx.fillStyle = "#6e6254";


for(const platform of platforms){

ctx.fillRect(

platform.x - cameraX,
platform.y,
platform.width,
platform.height

);

}


}



function drawPlayer(){


const x = player.x - cameraX;
const y = player.y;



ctx.fillStyle = "#d4af37";

ctx.fillRect(
x,
y,
player.width,
player.height
);



ctx.fillStyle = "#222";

ctx.fillRect(
x + 8,
y + 10,
26,
20
);



ctx.fillStyle = "#c8b28c";

ctx.beginPath();

ctx.arc(
x + 21,
y - 8,
14,
0,
Math.PI*2
);

ctx.fill();

}



function drawUI(){


ctx.fillStyle = "white";

ctx.font = "20px Arial";

ctx.fillText(
"The Lost Kingdom",
30,
40
);

}



function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


drawSky();

drawPlatforms();

drawPlayer();

drawUI();

}



function gameLoop(){

update();

draw();

requestAnimationFrame(
gameLoop
);

}



gameLoop();

</script>

</body>

</html>
