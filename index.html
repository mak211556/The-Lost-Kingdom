<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Lost Kingdom</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111111;
    overflow:hidden;
    font-family:'Cinzel', serif;
    color:white;
}

/* Background */

.background{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(212,175,55,0.15),
    transparent 60%);
}

/* Castle silhouette */

.castle{
    position:absolute;
    bottom:0;
    width:100%;
    height:50%;
    background:
    linear-gradient(to top,
    rgba(255,255,255,0.08),
    transparent);
    opacity:.12;
}

/* Main screen */

.screen{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    animation:fadeIn 2s ease;
}

/* Title */

.title{
    font-size:72px;
    font-weight:700;
    letter-spacing:4px;
    color:#D4AF37;
    text-shadow:0 0 20px rgba(212,175,55,.4);
}

/* Subtitle */

.subtitle{
    margin-top:20px;
    font-size:20px;
    color:#D8C3A5;
    letter-spacing:2px;
}

/* Button */

.start-btn{
    margin-top:60px;
    padding:18px 45px;
    border:none;
    border-radius:999px;
    background:#D4AF37;
    color:#111111;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.start-btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 25px rgba(212,175,55,.5);
}

/* Press key */

.press-key{
    position:absolute;
    bottom:60px;
    font-size:16px;
    color:#D8C3A5;
    animation:pulse 2s infinite;
}

/* Animations */

@keyframes pulse{
    50%{
        opacity:.35;
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="background"></div>
<div class="castle"></div>

<div class="screen">

    <div class="title">
        THE LOST KINGDOM
    </div>

    <div class="subtitle">
        Forgotten. Buried. Waiting.
    </div>

    <button class="start-btn" onclick="startGame()">
        Start Game
    </button>

</div>

<div class="press-key">
    Press Any Key
</div>

<script>

function startGame(){

    window.location.href = "game.html";

}

document.addEventListener("keydown", startGame);

</script>

</body>
</html>
