<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Platformer - Phaser 3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #fff;
        }
        #game-container {
            border: 3px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
        }
        .controls-info {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div class="controls-info">
        <b>A / D</b> or <b>Left / Right</b> to Move | <b>W / Space</b> to Jump / Climb Ledge
    </div>

<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 800 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

let player;
let platforms;
let hazards;
let door;
let cursors;
let keys;
let isGrabbingLedge = false;
let gameWon = false;

function preload() {
    // Preload Graphics & Spritesheets from Asset Repositories
    this.load.image('background', 'https://labs.phaser.io/assets/skies/space3.png');
    this.load.image('ground', 'https://labs.phaser.io/assets/sprites/platform.png');
    this.load.image('spike', 'https://labs.phaser.io/assets/sprites/spike.png');
    this.load.image('door', 'https://labs.phaser.io/assets/sprites/door.png');

    // Animated Character Spritesheet (32x48 frames)
    this.load.spritesheet('hero', 
        'https://labs.phaser.io/assets/sprites/dude.png',
        { frameWidth: 32, frameHeight: 48 }
    );
}

function create() {
    // 1. World Bounds setup (3000px wide side-scroller)
    this.physics.world.setBounds(0, 0, 3000, 450);

    // 2. Background Layers (Parallax effect)
    this.add.tileSprite(0, 0, 3000, 450, 'background').setOrigin(0, 0);

    // 3. Platform Group (Static Physics)
    platforms = this.physics.add.staticGroup();

    // Floor Base
    platforms.create(400, 430, 'ground').setScale(2, 1).refreshBody();
    platforms.create(1600, 430, 'ground').setScale(4, 1).refreshBody();
    platforms.create(2700, 430, 'ground').setScale(2, 1).refreshBody();

    // Raised Platforms & Ledges
    platforms.create(600, 320, 'ground');
    platforms.create(950, 250, 'ground');
    platforms.create(1350, 200, 'ground');
    platforms.create(1800, 280, 'ground');
    platforms.create(2200, 220, 'ground');

    // 4. Hazards (Spikes)
    hazards = this.physics.add.staticGroup();
    hazards.create(850, 410, 'spike');
    hazards.create(900, 410, 'spike');
    hazards.create(1150, 410, 'spike');

    // 5. Goal Door
    door = this.physics.add.staticSprite(2800, 350, 'door');

    // 6. Player Character Creation
    player = this.physics.add.sprite(100, 300, 'hero');
    player.setBounce(0.05);
    player.setCollideWorldBounds(true);

    // Collisions
    this.physics.add.collider(player, platforms);
    this.physics.add.overlap(player, hazards, hitHazard, null, this);
    this.physics.add.overlap(player, door, reachGoal, null, this);

    // 7. Animations Definition
    this.anims.create({
        key: 'left',
        frames: this.anims.generateFrameNumbers('hero', { start: 0, end: 3 }),
        frameRate: 10,
        repeat: -1
    });

    this.anims.create({
        key: 'turn',
        frames: [ { key: 'hero', frame: 4 } ],
        frameRate: 20
    });

    this.anims.create({
        key: 'right',
        frames: this.anims.generateFrameNumbers('hero', { start: 5, end: 8 }),
        frameRate: 10,
        repeat: -1
    });

    // 8. Camera Controls & Smooth Follow
    this.cameras.main.setBounds(0, 0, 3000, 450);
    this.cameras.main.startFollow(player, true, 0.08, 0.08);

    // 9. Controls Listener
    cursors = this.input.keyboard.createCursorKeys();
    keys = this.input.keyboard.addKeys('A,D,W,S,SPACE');
}

function update() {
    if (gameWon) return;

    const onGround = player.body.touching.down;

    // Movement Controls
    if (keys.A.isDown || cursors.left.isDown) {
        player.setVelocityX(-200);
        player.anims.play('left', true);
    } 
    else if (keys.D.isDown || cursors.right.isDown) {
        player.setVelocityX(200);
        player.anims.play('right', true);
    } 
    else {
        player.setVelocityX(0);
        player.anims.play('turn');
    }

    // Jump Physics
    if ((keys.W.isDown || keys.SPACE.isDown || cursors.up.isDown) && onGround) {
        player.setVelocityY(-420);
    }

    // Fall Off Death Respawn
    if (player.y > 440) {
        respawnPlayer();
    }
}

function hitHazard(player, hazard) {
    respawnPlayer();
}

function respawnPlayer() {
    player.setPosition(100, 300);
    player.setVelocity(0, 0);
}

function reachGoal(player, door) {
    gameWon = true;
    player.setVelocity(0, 0);
    player.anims.play('turn');

    const scene = player.scene;
    scene.add.text(scene.cameras.main.scrollX + 400, 200, 'STAGE CLEAR!', {
        fontSize: '48px',
        fill: '#ffd700',
        fontStyle: 'bold'
    }).setOrigin(0.5);
}
</script>
</body>
</html>
